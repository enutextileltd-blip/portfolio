<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#042331" />
      <stop offset="40%" stopColor="#02506d" />
      <stop offset="80%" stopColor="#0284c7" />
      <stop offset="100%" stopColor="#38bdf8" />
    </linearGradient>

    <!-- Cyan Ribbon Gradient -->
    <linearGradient id="cyanRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Lime / Yellow Outer Border -->
  <rect width="120" height="120" rx="12" fill="#d9f99d" stroke="#eab308" stroke-width="4" />
  
  <!-- White Inner Padding -->
  <rect x="5" y="5" width="110" height="110" rx="8" fill="#ffffff" />

  <!-- Main Card Dark Cyan Background -->
  <rect x="9" y="9" width="102" height="102" rx="6" fill="url(#bgGrad)" />

  <!-- Ambient Light Wave Backdrop -->
  <path d="M 9 20 Q 70 20 111 80 L 111 9 L 9 9 Z" fill="rgba(255, 255, 255, 0.15)" />
  <path d="M 60 111 Q 95 90 111 65 L 111 111 Z" fill="rgba(56, 189, 248, 0.25)" />

  <!-- Stylized White Outer Contour for 'A' -->
  <path d="M 60 14 L 16 92 L 35 92 L 50 62 L 70 62 L 85 92 L 104 92 Z" fill="#ffffff" />

  <!-- Left Black Leg of 'A' -->
  <path d="M 60 21 L 22 88 L 38 88 L 52 58 L 62 38 Z" fill="#09090b" />

  <!-- Right Black Leg with Curve -->
  <path d="M 60 21 L 68 44 Q 82 72 98 88 L 84 88 Q 72 70 60 46 Z" fill="#09090b" />

  <!-- Cyan Swoosh Accent on Right Leg -->
  <path d="M 64 56 Q 74 72 86 86 L 76 86 Q 66 72 58 60 Z" fill="url(#cyanRibbon)" />

  <!-- Inner Dynamic Swoosh / Wave -->
  <path d="M 48 55 Q 66 52 75 62 Q 62 60 52 64 Z" fill="#09090b" />
  <path d="M 52 61 Q 65 60 74 65 Q 64 64 55 66 Z" fill="#38bdf8" />

  <!-- Bottom White Banner for ACCESSORIES INDUSTRIES -->
  <rect x="9" y="88" width="102" height="23" fill="#ffffff" />

  <!-- Red ALMAS text inside 'A' arch -->
  <text x="60" y="84" text-anchor="middle" fill="#dc2626" font-weight="900" font-size="17" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.5">ALMAS</text>

  <!-- Blue ACCESSORIES INDUSTRIES text -->
  <text x="60" y="103" text-anchor="middle" fill="#0a2570" font-weight="900" font-size="7" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.4">ACCESSORIES INDUSTRIES</text>
</svg>
